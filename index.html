<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDA RNCO</title>
    <!-- Biblioteca para gerar PDF direto sem ser bloqueado pelo Google Sites -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 10px; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .header { background: #1b365d; color: #fff; padding: 12px; border-radius: 6px; text-align: center; font-size: 1rem; font-weight: bold; text-transform: uppercase; }
        .section-title { color: #2c4d75; font-size: 0.9rem; font-weight: bold; border-bottom: 2px solid #e5e7eb; padding-bottom: 5px; margin-bottom: 10px; margin-top: 10px; text-transform: uppercase; }
        label { display: block; font-size: 0.85rem; font-weight: bold; color: #444; margin-top: 8px; margin-bottom: 4px; }
        input[type="text"], input[type="date"], textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
        textarea { height: 60px; }
        .group { background: #f9fafb; padding: 8px; border-radius: 4px; border: 1px dashed #d1d5db; display: flex; flex-wrap: wrap; gap: 10px; }
        .group label { font-weight: normal; font-size: 0.8rem; margin: 0; cursor: pointer; }
        .photo-box { border: 2px dashed #cbd5e1; padding: 10px; text-align: center; border-radius: 6px; background: #f8fafc; margin-bottom: 10px; }
        .preview-img { max-width: 100px; max-height: 100px; border-radius: 4px; border: 1px solid #ccc; margin-top: 5px; display: block; margin-left: auto; margin-right: auto; }
        .btn-submit { width: 100%; padding: 14px; background: #1b365d; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        
        /* Estilo do PDF Gerado */
        #pdfContent { display: none; background: #fff; padding: 20px; font-family: Arial, sans-serif; }
        .pdf-header { background: #1b365d; color: white; text-align: center; padding: 10px; font-size: 1.1rem; font-weight: bold; text-transform: uppercase; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .pdf-table th, .pdf-table td { border: 1px solid #ccc; padding: 8px; font-size: 0.85rem; text-align: left; }
        .pdf-table th { background: #f2f2f2; width: 35%; }
        .pdf-photos { display: flex; gap: 10px; justify-content: space-around; margin-top: 15px; }
        .pdf-photo-item { text-align: center; font-size: 0.75rem; font-weight: bold; }
        .pdf-photo-item img { max-width: 200px; max-height: 150px; border: 1px solid #999; border-radius: 4px; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">ADDA RNCO - Relatório de Não Conformidade</div>

    <form id="rncoForm">
        <div class="section-title">1. Identificação Inicial</div>
        <label>Etapa:</label>
        <div class="group">
            <label><input type="radio" name="etapa" value="Descarga" required> Descarga</label>
            <label><input type="radio" name="etapa" value="Montagem"> Montagem</label>
        </div>

        <label for="data">Data:</label>
        <input type="date" id="data" required>

        <label for="notaFiscal">Número da Nota Fiscal:</label>
        <input type="text" id="notaFiscal" placeholder="Ex: NF 12345">

        <label for="transportadora">Transportadora / Motorista:</label>
        <input type="text" id="transportadora" placeholder="Nome da empresa ou motorista">

        <label for="codigoPeca">Código da Peça:</label>
        <input type="text" id="codigoPeca" placeholder="Ex: PA01, Viga V-02..." required>

        <div class="section-title">2. Avaliação e Destino</div>
        <label>Avaliação de Inconformidade:</label>
        <div class="group">
            <label><input type="radio" name="avaliacao" value="Baixo (Alerta para fábrica)" required> Baixo (Alerta)</label>
            <label><input type="radio" name="avaliacao" value="Moderado (Montagem com manutenção)"> Moderado (Com manutenção)</label>
            <label><input type="radio" name="avaliacao" value="Crítico (Devoluçao de peça)"> Crítico (Devolver)</label>
        </div>

        <label for="mapeamento">Local na Obra (Mapeamento):</label>
        <input type="text" id="mapeamento" placeholder="Ex: Bloco B, 2º Pavimento">

        <label>Tipo de Inconformidade:</label>
        <div class="group">
            <label><input type="checkbox" name="tipo" value="Dano estrutural"> Estrutural</label>
